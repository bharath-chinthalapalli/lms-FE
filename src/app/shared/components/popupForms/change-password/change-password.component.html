<div tabindex="-1" aria-hidden="true" class="bg-r_color_secondary-900/50 fixed h-screen top-0 right-0 left-0 z-50 md:inset-0">
    <ng-container>
        <div
          class="outline: 0; p-4 mx-auto my-[10%] max-w-md  bg-white rounded-md flex justify-center items-center"
        >
          <div>
            <div class="modal-header flex-shrink-0 text-center p-2 border--200 rounded-t-md">
              <p class="text-['#121D54'] text-xl font-bold">
                Change Password
              </p>
            </div>
            <form class=" " [formGroup]="chnagepasswordForm">
              <div>
                <label for="" class="text-sm font-normal text-grayPrimary">Old Password <span
                    class="text-red_star">*</span></label>
                <div class="relative">
                  <input type="{{ isPasswordVisible ? 'text' : 'password' }}" placeholder="Enter old password"
                    formControlName="oldPassword" />
                  <img class="absolute w-5 h-5 top-4 right-4" [src]="
                      isPasswordVisible
                        ? _commonService.Images.PASSWORD_VIEW
                        : _commonService.Images.PASSWORD_CLOSE_ICON
                    " (click)="togglePasswordVisibility()" alt="Toggle Password Visibility" />
                </div>
                <div *ngIf="
                    chnagepasswordForm.get('oldPassword')?.invalid &&
                    chnagepasswordForm.get('oldPassword')?.touched
                  ">
                  <div *ngIf="
                      chnagepasswordForm.get('oldPassword')?.hasError('required')
                    " class="error-message">
                    Password is required
                  </div>
                  <div *ngIf="
                      chnagepasswordForm.get('oldPassword')?.hasError('pattern')
                    " class="error-message">
                    Invalid format
                  </div>
                </div>
              </div>
              <div>
                <label for="" class="text-sm font-normal text-grayPrimary">New Password <span
                    class="text-red_star">*</span></label>
                <div class="relative">
                  <input type="{{ isNewPasswordVisible ? 'text' : 'password' }}" placeholder="Enter Password"
                    formControlName="newPassword" />
                  <img class="absolute w-5 h-5 top-4 right-4" [src]="
                      isNewPasswordVisible
                        ? _commonService.Images.PASSWORD_VIEW
                        : _commonService.Images.PASSWORD_CLOSE_ICON
                    " (click)="toggleNewPasswordVisibility()" alt="Toggle Password Visibility" />
                </div>
                <div *ngIf="
                    chnagepasswordForm.get('newPassword')?.invalid &&
                    chnagepasswordForm.get('newPassword')?.touched
                  ">
                  <div *ngIf="
                      chnagepasswordForm.get('newPassword')?.hasError('required')
                    " class="error-message">
                    New Password is required
                  </div>
                  <div *ngIf="
                      chnagepasswordForm
                        .get('newPassword')
                        ?.hasError('invalidPassword')
                    " class="error-message">
                    Invalid Password format
                  </div>
                </div>
              </div>
    
              <div>
                <label for="" class="text-sm font-normal text-grayPrimary">Re Enter Password <span
                    class="text-red_star">*</span></label>
                <div class="relative">
                  <input type="{{ isRePasswordVisible ? 'text' : 'password' }}" placeholder="Re Enter Password"
                    formControlName="reEnterPassword" />
                  <img class="absolute w-5 h-5 top-4 right-4" [src]="
                      isRePasswordVisible
                        ? _commonService.Images.PASSWORD_VIEW
                        : _commonService.Images.PASSWORD_CLOSE_ICON
                    " (click)="toggleRePasswordVisibility()" alt="Toggle Password Visibility" />
                </div>
                <div *ngIf="chnagepasswordForm.hasError('passwordMismatch')" class="error-message">
                  Passwords do not match
                </div>
              </div>
              <div class="flex flex-col gap-6 mt-5  mb-0  justify-end">
                <div class="flex gap-2 justify-end mx-0">
                  <button type="submit" (click)="closePopUp()"
                      class="text-gray-600 px-4  font-bold  text-sm border-[1px] border-gray-600 rounded-md ">
                      Cancel
                  </button>
                  <button type="submit" [disabled]="chnagepasswordForm.invalid" [ngClass]="
                      chnagepasswordForm.invalid
                        ? 'bg-primary-color-700 py-3 text-xs px-6 text-white font-bold rounded-md cursor-not-allowed'
                        : 'bg-primary-color-700 py-3 text-xs px-6 text-white font-bold rounded-md'
                    " (click)="submit()">
                    Change Password
                  </button>
                </div>
              </div>
            </form>
    
          </div>
        </div>
      </ng-container>
</div>
