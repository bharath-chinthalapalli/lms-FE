<div tabindex="-1" aria-hidden="true" class="bg-r_color_secondary-900/50 fixed h-screen top-0 right-0 left-0 z-50 md:inset-0">
   
  <div
  class="outline: 0; p-4 mx-auto my-[10%] max-w-md  bg-white rounded-md flex justify-center items-center"
  >   
      <div>
        <form class=" " [formGroup]="addInviteUserForm">
          <div class="modal-header flex-shrink-0 text-center p-2 border--200 rounded-t-md">
            <p class="text-['#121D54'] text-xl font-bold">
              Add USer
            </p>
          </div>
          <ng-container 
            *ngIf="type == _commonService.TextEnums.COMPANY_ADMIN_USERS">
          
                <div class="lms-form-child-container">
                    <p class="lms-form-label">Names</p>
                    <input
                    formControlName="name"
                    type="text"
                    placeholder="Enter name"
                    class="form-control  inputs"
                    />
                </div>
                <div class="lms-form-child-container">
                    <p class="lms-form-label">Phone Number</p>
                    <input
                    formControlName="phoneNumber"
                    type="tel"
                    placeholder="Enter phone number"
                    class="form-control  inputs"
                    />
                </div>

                <div class="lms-form-child-container">
                    <!-- <p class="lms-form-label">Skill</p>
                    <input
                    type="number"
                    placeholder="Enter phone number"
                    formControlName="skill"
                    class="form-control inputs"
                    /> -->

                    <select name="skill" id="skill" formControlName="skill"
                      class="form-control">
                    <option value="">Select Skill</option>
                    <option value="{{item1.id}}" *ngFor="let item1 of getAllSkillsArray" class="text-grayPrimary">
                      {{item1.name}}
                    </option>
                  </select>
                </div>
          </ng-container>

          <div class="flex flex-col gap-6 my-5  mb-0 justify-end ">
            <div class="flex gap-2 justify-end mx-0">
              <button type="button" (click)="close()"
               class="text-gray-600 px-4  font-bold  text-sm border-[1px] border-gray-600 rounded-md ">
                Cancel
              </button>
              <button type="button" class="bg-primary-color-700 py-3 text-xs px-6 text-white font-bold rounded-md" 
              (click)="add()">
                {{ btntext }}
              </button>
            </div>
          </div> 
        </form>
        
      </div>
    </div>
</div>
