<ng-template appPlaceholder></ng-template>

<div class="content">
    <div class="flex items-end justify-between">
        <app-heading-description [heading]="'Groups'" [description]="
          'Groups help in creating and adding users to courses easy'">
        </app-heading-description>
        <div class="flex items-center gap-4">
          <div class="flex flex-row justify-end gap-4">
            <div class="relative flex rounded">
              <span class="absolute top-3 left-3">
                <img
                  [src]="_commonService.Images.SEARCH_ICON"
                  alt="serach icons"
                />
              </span>
              <input
                type="search"
                class=" border border-gray-300 rounded-md py-2.5 pl-9 pr-4 placeholder:text-sm placeholder:text-r_color_secondary-500 placeholder:font-normal"
                placeholder="Search"
                (input)="getSearchData($event)"
              />
            </div>
          </div>
          <div>
            <app-button-icon
            [icon]="_commonService.Images.ADD_PLUS_ICON"
            [btn_text]="'Create Group'">
            </app-button-icon>
          </div>
        </div>
    </div>

    <div class="pt-8 grid xl:grid-cols-3 md:grid-cols-2 sm:grid-cols-1 gap-6">
        <div class="bg-white border-[1px] border-gray-200 rounded-[10px]" *ngFor="let item of getGroupsDetailsArray">
            <div class="p-4 ">
                <div class="flex items-center justify-between">
                    <div class="bg-orange-700 rounded-full relative h-11 w-11 text-center ">
                        <p class="font-semibold	text-lg  text-white mt-2 uppercase">{{item.groupName?.charAt(0)}}</p>
                    </div>
                    <div class="bg-white p-1.5 border-[1.8px] border-gray-200 rounded-[4px]">
                        <img [src]="_commonService.Images.EDIT_ICON" alt="edit" class="cursor-pointer">
                    </div>
                </div>
                <p class="text-lg  text-gray-800 font-semibold mt-2">
                    {{item.groupName}}
                </p>
                <p class="text-sm  text-gray-500 font-normal mt-2 leading-4">
                    Created by<span class=" text-gray-500 font-semibold ml-1">{{item.createdBy}}</span> on <span class="  text-gray-500 font-semibold">{{item.createdOn}}</span>
                </p>
            </div>
            <hr class="bg-gray-200 h-[1px]">
            <div class="flex items-center justify-between p-4">
                <div class="flex items-center ">
                    <div class="">
                        <img [src]="_commonService.Images.GROUP_CARD_USER_1" alt="" class="!w-[32px] !h-[32px] border-[2px] border-white">
                    </div>
                    <div class="-ml-2.5">
                        <img [src]="_commonService.Images.GROUP_CARD_USER_2" alt="" class="!w-[32px] !h-[32px] border-[2px] border-white rounded-full">
                    </div>
                    <div  [ngClass]="item.userCount >3  ? '-ml-2.5 bg-[#F9FAFF] flex items-center pr-2.5 rounded-full' : '-ml-1 bg-[#F9FAFF] flex items-center  rounded-full'"
                     class="">
                        <img [src]="_commonService.Images.GROUP_CARD_USER_3" alt="" class="!w-[32px] !h-[32px]  border-[2px] border-white rounded-full">
                        <p class=" font-normal text-xs text-gray-700">
                          {{item?.userCount > 3 ? '+' : ''}}
                          {{item?.userCount > 3 ? (item.userCount - 3) : ''}}
                        </p>
                    </div>
                </div>
                <div >
                    <app-add-button-icon
                    (click)="openPopupAssignUser(item.id)"
                    [icon]="_commonService.Images.ADD_PLUS_ICON"
                    [btn_text]="'Assign User'">
                    </app-add-button-icon>
                </div>
            </div>
        </div>
    </div>
    <div *ngIf="getGroupsDetailsArray.length > 0" class="flex  items-center justify-between text-r_color_secondary-700 text-sm font-medium">
      <div>
        <p>Showing <span class="!font-semibold">{{offset * 1 + 1 }} </span> 
           to <span class="!font-semibold">{{offset + numberOfElements}}</span>
           of  <span class="!font-semibold">  {{totalElements}}</span> </p>
      </div>
      <app-paginator *ngIf="getGroupsDetailsArray.length > 0" [currentPage]="currentPage" [totalPages]="totalPages"
        (pageChange)="onPageChange($event)">
      </app-paginator>
    </div>

</div>
