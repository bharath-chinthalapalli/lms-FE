<div>
  <div class="flex items-center gap-3 mb-8">
    <img
      [src]="commonService.Images.BACK_ICON"
      alt="back icon"
      class="cursor-pointer"
      (click)="goBackToCourseView()"
    />
    <app-heading-description [heading]="'Add Course'"></app-heading-description>
  </div>
  <div
    class="border border-r_color_secondary-200 rounded-xl p-5 bg-r_color_base"
  >
    <div
      class="rounded-md border border-x-r_color_secondary-300 grid grid-cols-3 mb-6"
    >
      <div class="flex justify-between">
        <div
          class="flex items-center gap-4 text-primary-color-700 text-sm font-medium px-6 py-4"
        >
          <div class="rounded-full border border-primary-color-700 w-4 h-4">01</div>
          Course Details
        </div>

        <div>
          <img [src]="commonService.Images.ARROW_ADD_ICON_POPUP" alt="arrow" />
        </div>
      </div>
      <div class="flex justify-between">
        <div
          class="flex items-center gap-4 text-r_color_secondary-500 text-sm font-medium px-6 py-4"
        >
          <div class="rounded-full border border-r_color_secondary-500 p-1">
            02
          </div>
          content
        </div>

        <div>
          <img [src]="commonService.Images.ARROW_ADD_ICON_POPUP" alt="arrow" />
        </div>
      </div>
      <div class="flex justify-between">
        <div
          class="flex items-center gap-4 text-r_color_secondary-500 text-sm font-medium px-6 py-4"
        >
          <div class="rounded-full border border-r_color_secondary-500 p-1">
            03
          </div>
          Quiz
        </div>
      </div>
    </div>
    <div *ngIf="false">
      <p class="font-semibold text-base text-r_color_secondary-700 mb-3">
        Course Details
      </p>

      <div class="flex flex-col gap-6 w-1/3">
        <div class="flex flex-col gap-1">
          <label class="lms-form-label">Course Title</label>
          <input
            type="text"
            placeholder="Enter company name"
            class="form-control"
          />
        </div>
        <div class="flex flex-col gap-1">
          <label class="lms-form-label">Category</label>
          <select class="form-control">
            <option>Select Category</option>
          </select>
        </div>
        <div class="flex flex-col gap-1">
          <label class="lms-form-label">Tags</label>
          <select class="form-control">
            <option>Tags Select Tags or Start typing</option>
          </select>
        </div>
        <div class="flex flex-col gap-1">
          <label class="lms-form-label">Available till</label>
          <input type="date" class="form-control" />
        </div>
        <div class="flex flex-col gap-1">
          <label class="lms-form-label">Certification</label>
          <div class="flex gap-2">
            <input type="radio" id="yes" name="yesNO" />
            <label for="Yes" class="lms-form-label">Yes</label>
          </div>
          <div class="flex gap-2">
            <input type="radio" id="no" name="yesNO" />
            <label for="no" class="lms-form-label">No</label>
          </div>
        </div>
        <div class="flex flex-col gap-1">
          <label class="lms-form-label">Description</label>
          <textarea rows="5" cols="50" class="form-control"></textarea>
        </div>
        <div class="flex flex-col gap-1">
          <label class="lms-form-label">Cover Images</label>
        </div>
      </div>
    </div>
    <div *ngIf="false">
      <p class="font-semibold text-base text-r_color_secondary-700 mb-3">
        Content
      </p>
      <div class="rounded-md bg-r_color_secondary-50 flex flex-col gap-4 p-4">
        <input
          class="form-control-course"
          type="text"
          placeholder="Add Section Title"
        />
        <div class="flex items-center gap-8 mb-8">
          <div
            class="text-r_color_secondary-500 text-sm font-medium flex items-center gap-1"
          >
            <img [src]="commonService.Images.PLAY_ICON" alt="icons" />
            <p>Text</p>
          </div>
          <div
            class="text-r_color_secondary-500 text-sm font-medium flex items-center gap-1"
          >
            <img [src]="commonService.Images.IMAGES_ICON" alt="icons" />
            <p>Images</p>
          </div>
          <div
            class="text-r_color_secondary-500 text-sm font-medium flex items-center gap-1"
          >
            <img [src]="commonService.Images.PLAY_ICON" alt="icons" />
            <p>Video</p>
          </div>
        </div>

        <div>
          <button
            class="px-3 p-2 border-2 border-primary-color-600 text-primary-color-600 text-sm font-medium flex items-center gap-2 rounded"
          >
            <svg-icon
              [src]="commonService.Images.ADD_PLUS_ICON"
              [svgClass]="'text-primary-color-600'"
            ></svg-icon>
            Section
          </button>
        </div>
      </div>
    </div>

    <div *ngIf="false">
      <p class="font-semibold text-base text-r_color_secondary-700 mb-3">
        Quiz
      </p>
      <div
        class="bg-r_color_base border border-r_color_secondary-200 px-2 py-5 flex w-full"
      >
        <div>
          <svg-icon
            [src]="commonService.Images.DRAG_AND_DROP"
            [svgClass]="'text-r_color_secondary-400'"
          ></svg-icon>
        </div>
        <div class="flex flex-col gap-1">
          <p class="text-r_color_secondary-700 font-normal text-sm">
            Question 1
          </p>
          <input class="form-control" placeholder="Enter Question" />
          <div
            class="flex items-center gap-2 px-2 py-2 border border-r_color_secondary-100 rounded"
          >
            <svg-icon
              [src]="commonService.Images.ADD_COURSE_QUIZ_QUESTION_ICON"
              [svgClass]="'text-r_color_secondary-300'"
            ></svg-icon>
            <input
              type="text"
              placeholder="Option 1"
              class="border-none outline-none placeholder:text-r_color_secondary-500 placeholder:text-xs placeholder:font-normal"
            />
          </div>
          <div
            class="flex items-center gap-2 px-2 py-2 border border-r_color_secondary-100 rounded"
          >
            <svg-icon
              [src]="commonService.Images.ADD_COURSE_QUIZ_QUESTION_ICON"
              [svgClass]="'text-r_color_secondary-300'"
            ></svg-icon>
            <input
              type="text"
              placeholder="Option 2"
              class="border-none outline-none placeholder:text-r_color_secondary-500 placeholder:text-xs placeholder:font-normal"
            />
          </div>
        </div>
      </div>
    </div>
    <!--
    <div class="flex items-center">
            <svg-icon
              [src]="commonService.Images.ADD_COURSE_QUIZ_QUESTION_ICON"
              [svgClass]="'text-r_color_secondary-300'"
            ></svg-icon>

          </div> -->

    <div class="lms-footer-add-course flex items-center gap-3 mt-6">
      <button
        type="button"
        class="px-4 py-2 border bg-primary-color-700 rounded-md border-r_color_secondary-300 shadow-sm text-sm text-r_color_base font-medium"
      >
        Next
      </button>
      <button
        type="button"
        class="px-4 py-2 border rounded-md border-r_color_secondary-300 shadow-sm text-sm text-r_color_secondary-700 font-medium"
      >
        Cancel
      </button>
    </div>
  </div>
</div>
