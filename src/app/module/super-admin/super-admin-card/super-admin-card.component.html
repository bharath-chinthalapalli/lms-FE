<div
  class="bg-white flex flex-col rounded-b-lg shadow-[0px_4px_6px_-2px_rgba(0,0,0,0.05)] relative lms-super-admin-card card mt-4"
> 
  <div class="absolute right-4 top-4 cursor-pointer  lms-threedots z-20">
    <app-three-dots-menu [threeDotsMenu]="threeDotsMenu"></app-three-dots-menu>
  </div>
  <div class="">
    <div class=" imageCard z-10 "></div>
    <img
      [src]="_commonService.Images.CARD_MAIN_IMAGES"
      alt="main-img"
      class="w-full max-h-56 object-cover rounded-t-lg relative "
    />
  </div>
  <div class="py-3 px-4 flex flex-col ">
    <div class="">
      <div class="flex flex-col gap-2">
        <div class="flex justify-between">
          <p class="text-green-700 font-medium text-sm">Contruction</p>
          <div class="flex flex-col gap-2">
            <p class="text-xs font-normal text-r_color_secondary-500">
              Available till:
            </p>
            <p class="text-sm font-normal text-r_color_secondary-800">
              {{ super_card_data?.available_till }}
            </p>
          </div>
        </div>

        <h1 class="text-xl font-semibold text-r_color_secondary-900 -mt-4">
          {{ super_card_data?.name }}
        </h1>
        <p class="text-sm font-normal text-r_color_secondary-500">
          {{ super_card_data?.description }}
        </p>
      </div>
      
    </div>
    <div class="flex items-center gap-3 my-4">
      <div
        class="py-2 px-3 rounded text-r_color_secondary-700 text-sm font-medium bg-primary-color-50"
      >
        Site Related
      </div>
      <div
        class="py-2 px-3 rounded text-r_color_secondary-700 text-sm font-medium bg-r_color_orange-50"
      >
        Safety Procedure
      </div>
    </div>
    <div class="flex items-center justify-between">
      <div
        (click)="assign()"
        class="py-3 px-3 border border-[#2441E7] text-xs font-medium rounded text-[#2441E7] flex items-center gap-2"
      >
        <img [src]="_commonService.Images.ASSIGN_ICON" alt="assign icon" />
        <p>Assign</p>
      </div>
      <div
        class="font-medium flex items-center gap-2 text-sm text-r_color_secondary-500"
      >
        <svg-icon
          [src]="_commonService.Images.SIDEBAR_MY_COMPANY_ICON"
          [svgClass]="'text-r_color_secondary-600 font-semibold'"
        ></svg-icon>
        <p>{{ super_card_data?.organisation_count }}+</p>
      </div>
    </div>
  </div>
</div>
