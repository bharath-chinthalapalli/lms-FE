<div class="flex h-screen">
  <div class="w-1/4 flex items-center justify-end">
    <div class="flex flex-col w-80">
      <div>
        <img [src]="_common.Images.LOGO" alt="" />
      </div>
      <p class="text-2xl text-gray-700 font-semibold mt-5">Login</p>

      <form (submit)="login()" [formGroup]="loginform" autocomplete="off">
        <div class="flex flex-col gap-2 mt-6">
          <div>
            <label for="phoneNumber">Phone Number</label>
          </div>
          <input type="tele" name="phoneNumber" formControlName="phoneNumber" id="phoneNumber"
            placeholder="Enter your Phone Number" />
            <ng-container>
              <!-- <div *ngIf="loginform.get('contactNumber')?.hasError('pattern')" class="text-red-700 text-xs">
                Phone number is need 10 numeric digits 
              </div>   -->
              <div *ngIf="submitted && f['phoneNumber'].errors || loginform.get('phoneNumber')?.hasError('pattern')" class="text-red-600 text-xs">
                 Phone number is required 
              </div>
            </ng-container>
        </div>
        <div class="flex flex-col gap-2 mt-6">
          <div>
            <label for="password">Password</label>
          </div>
          <div class="flex relative">
            <input [type]="isShowEye ? 'text' : 'password'" name="password" formControlName="password" id="password"
              placeholder="Enter your Password" />
            <img alt="eye" [src]="
            isShowEye
              ? _commonService.Images.CC_EYE_OPEN_ICON
              : _commonService.Images.CC_EYE_CLOSE_ICON
          " class="absolute right-2.5 top-3.5 displayTheIconsInNormalScreen cursor-pointer" (click)="getImageAuthKey()" />

          </div>
          <div *ngIf="submitted && f['password'].errors" class="text-red-600 text-xs">
            Password is required
          </div>
        </div>
        <!-- routerLink="" -->
        <div class="mt-6">
          <button type="submit"
            class="w-full h-10 font-semibold bg-primary-color-600 cursor-pointer text-base text-white rounded-md">
            Submit
          </button>
        </div>
      </form>
      <h1 class="text-primary-color-600  text-center text-base font-medium cursor-pointer mt-6"
      (click)="loadForgetForm()">
        Forgot Password?
      </h1>
      <div class="mt-6">
        <button
          class="w-full h-11 font-semibold text-sm border border-primary-color-600 text-primary-color-600 rounded-md">
          Sign up using OTP
        </button>
      </div>
      <!-- <div class="text-center mt-6">
        <span>New to platform?</span><span class="!text-primary-color-600 cursor-pointer">
          Register Here</span>
      </div> -->
    </div>
  </div>
  <div class="w-3/4 bg-[url('assets/images/login-bg.svg')] bg-no-repeat bg-cover"></div>
</div>
